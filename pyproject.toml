[project]
name = "mini-orbslam"
version = "0.1.0"
description = "A small ORB-SLAM-style monocular SLAM pipeline, built step by step for learning."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
